<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice To Note – In-app Hero Preview</title>
<meta name="description" content="Interactive preview of the Voice To Note hero section, showing a live workflow animation placed inside the app's real home screen layout.">
<link rel="canonical" href="https://vtn-hero-demo.vercel.app/preview.html">
<meta name="keywords" content="Voice To Note, hero animation, voice notes app, app demo">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0a0a0c;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;overflow:hidden}
.top{padding:10px 12px 6px;text-align:center;font-size:12px;color:#9a9aa0;max-width:440px;line-height:1.4}
.seg{display:inline-flex;background:#1c1c1e;border-radius:99px;padding:4px;margin-bottom:6px}
.seg button{font:inherit;font-size:13px;color:#aaa;background:none;border:0;border-radius:99px;padding:8px 16px;cursor:pointer}
.seg button.on{background:#ff1f57;color:#fff}
.seg button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.wrap{flex:none;width:calc(360px*var(--s,1));height:calc(800px*var(--s,1))}
.phone{width:360px;height:800px;background:#000;border-radius:28px;overflow:hidden;position:relative;transform-origin:0 0;transform:scale(var(--s,1));box-shadow:0 0 0 1px #2a2a2e}
/* scrolling home screen: header, premium banner, ANIMATION, rest of the original home */
.scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.hdr{height:80px;display:flex;align-items:center;gap:10px;padding:14px 14px 0}
.av{width:40px;height:40px;border-radius:50%;background:#ff5a1f;display:grid;place-items:center;font-weight:700}
.hi{flex:1}.hi small{color:#9a9aa0;font-size:12px}.hi b{display:block;font-size:19px}
.rb{width:36px;height:36px;border-radius:50%;background:#1f1f22;display:grid;place-items:center;font-size:14px}
.pre{display:block;width:360px;height:85px}
.rest{display:block;width:360px;height:537px}
.end{height:72px}
/* animation slot: glow + tilted, floating card */
.slot{position:relative;height:784px}
.slot::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 48%,#ff1f5718,transparent 70%)}
.tag{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.14em;color:#ff7a96;font-weight:700}
.rp{position:absolute;top:4px;right:12px;z-index:2;font:inherit;font-size:10px;color:#ff7a96;background:none;border:0;cursor:pointer;padding:4px}
.float{position:absolute;left:14px;top:32px;width:332px;height:738px;perspective:900px;animation:fl 4.5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.card{width:100%;height:100%;border-radius:22px;overflow:hidden;background:#000;transform:rotateX(var(--rx,6deg)) rotateY(var(--ry,-8deg));transition:transform .25s ease-out;box-shadow:0 0 0 1.5px #ff1f57,0 0 0 5px #ff1f5722,0 8px 18px #ff1f5744}
.card iframe{width:360px;height:800px;border:0;transform-origin:0 0;transform:scale(.9222);display:block}
.hint{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.08em;color:#8a8a90}
.phone.before .slot{display:none}
/* fixed bottom: floating mic + navigation from the real app */
.dock{position:absolute;left:0;right:0;bottom:0;height:150px;pointer-events:none}
.dock img{position:absolute;display:block}
.nv{left:12px;bottom:10px;width:336px;height:60px}
.fb{left:290px;bottom:82px;width:56px;height:56px}
@media (prefers-reduced-motion:reduce){.float{animation:none}.card{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<h1 class="sr">Voice To Note – Hero Section Live Workflow Preview</h1>
<div class="top" id="top">
 <div class="seg" role="group" aria-label="Preview mode"><button id="bB">Before</button><button id="bA" class="on">After (with animation)</button></div><br>
</div>
<div class="wrap" id="wrap"><div class="phone" id="ph">
 <div class="scroll" id="sc">
  <div class="hdr"><div class="av">U</div><div class="hi"><small>Good evening</small><b>Hi, User</b></div><div class="rb">?</div><div class="rb">⚙</div></div>
  <img class="pre" src="preview-premium.jpg" alt="Go Premium banner">
  <div class="slot">
   <span class="tag">LIVE WORKFLOW</span><button class="rp" id="rp" aria-label="Replay animation">&#8635; Replay</button>
   <div class="float"><div class="card" id="card"><iframe id="fr" src="index.html?embed" title="Animated hero section"></iframe></div></div>
  </div>
  <img class="rest" src="preview-rest.jpg" alt="New Note and Recent Note tiles, novel card, game tile, Recent/Pinned notes tabs and the empty notes illustration">
  <div class="end"></div>
 </div>
 <div class="dock"><img class="nv" src="preview-dock.png" alt="Bottom navigation"><img class="fb" src="preview-fab.png" alt="Floating mic button"></div>
</div></div>
<script>
(()=>{
const $=s=>document.querySelector(s),fr=$('#fr'),ph=$('#ph'),card=$('#card'),sc=$('#sc');
function fit(){const h=innerHeight-$('#top').offsetHeight-8;document.documentElement.style.setProperty('--s',Math.max(.4,Math.min(innerWidth/360,h/800,1.3)))}
function load(){fr.style.visibility='hidden';fr.src='index.html?embed'}
function mode(after){$('#bA').classList.toggle('on',after);$('#bB').classList.toggle('on',!after);
 ph.classList.toggle('before',!after);sc.scrollTop=0;if(after)load();else fr.src='about:blank'}
fr.addEventListener('load',()=>{fr.style.visibility='visible';try{const d=fr.contentDocument,t=d.createElement('style');t.textContent='.demo{display:none!important}';d.head.append(t)}catch(e){}});
$('#rp').onclick=load;
$('#bA').onclick=()=>mode(true);$('#bB').onclick=()=>mode(false);
// mouse only: card leans slightly towards the pointer
ph.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=ph.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
 card.style.setProperty('--ry',(x*16)+'deg');card.style.setProperty('--rx',(2-y*12)+'deg')});
ph.addEventListener('pointerleave',()=>{card.style.removeProperty('--ry');card.style.removeProperty('--rx')});
addEventListener('resize',fit);fit();setTimeout(fit,300);
})();
</script>
</body>
</html>
