<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VoiceToNotes – Mobile Landing Page Prototype</title>
<meta name="description" content="Mobile landing page prototype: the phone shows the live Voice To Note workflow animation instead of a static image.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@700&display=swap" rel="stylesheet">
<style>
:root{--red:#e11d48;--ink:#111}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
/* The page is one mobile screen. All sizes use the screen itself (cqw/cqh), so it looks the same in a real phone and in the phone-shaped box on desktop. */
.device{container-type:size;width:100vw;height:100vh;height:100svh;background:#fff;overflow:hidden;position:relative}
.page{height:100%;display:flex;flex-direction:column;padding:0 5cqw 1.6cqh}
/* header */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;height:clamp(40px,6.2cqh,52px);margin:0 -1cqw}
.top img{display:block;height:clamp(22px,3.6cqh,28px);width:auto}
.menu{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;cursor:pointer;padding:0}
.menu i{display:block;width:26px;height:2px;background:#111;border-radius:2px;box-shadow:0 -8px 0 #111,0 8px 0 #111}
.menu:focus-visible{outline:2px solid var(--red);outline-offset:2px}
/* text */
main{flex:1;min-height:0;display:flex;flex-direction:column}
.hero{flex:none;text-align:center;padding-top:clamp(6px,2cqh,28px)}
h1{font-family:Lora,Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(15px,min(4.7cqw,2.7cqh),26px);line-height:1.28}
h1 em{font-style:normal;color:var(--red)}
.lead{margin:clamp(8px,1.9cqh,22px) auto 0;font-size:clamp(12px,min(3.95cqw,2.05cqh),18px);line-height:1.5;color:#4b5563;max-width:440px}
.cta{display:inline-block;margin-top:clamp(12px,2.5cqh,30px);background:#1a1a1a;color:#fff;border-radius:12px;padding:clamp(10px,1.7cqh,14px) 26px;font-size:clamp(14px,2cqh,16px);font-weight:600;box-shadow:0 6px 14px rgba(0,0,0,.2)}
/* phone: takes all the height that is left */
.phonewrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;margin-top:clamp(10px,2.4cqh,30px)}
.pstage{flex:1;min-height:0;width:100%;position:relative}
.phone{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);aspect-ratio:242/540;max-width:100%;border-radius:5.2cqh;background:#000;padding:1.1cqh;box-shadow:0 0 0 2px #2b2b2d,0 0 0 4px #111,0 14px 30px rgba(0,0,0,.2)}
.phone:before,.phone:after{content:"";position:absolute;width:3px;background:#222;border-radius:2px;left:-5px}
.phone:before{top:19%;height:5.5%}.phone:after{top:27%;height:10%}
.screen{position:relative;width:100%;height:100%;border-radius:calc(var(--u,1)*36px);overflow:hidden;background:#0a0a0c}
.screen iframe{position:absolute;left:0;top:0;width:360px;height:800px;border:0;background:#0a0a0c;transform-origin:0 0}
.island{position:absolute;top:calc(7px*var(--u,1));left:50%;width:calc(66px*var(--u,1));height:calc(19px*var(--u,1));margin-left:calc(-33px*var(--u,1));border-radius:99px;background:#000;box-shadow:0 0 0 1px #26262a;z-index:3;pointer-events:none}
.island:after{content:"";position:absolute;right:calc(8px*var(--u,1));top:50%;width:calc(6px*var(--u,1));height:calc(6px*var(--u,1));margin-top:calc(-3px*var(--u,1));border-radius:50%;background:radial-gradient(circle at 35% 35%,#3b4f86,#10162b 60%,#05060c)}
.sb{position:absolute;left:0;right:0;top:calc(7px*var(--u,1));height:calc(19px*var(--u,1));display:flex;align-items:center;justify-content:space-between;padding:0 calc(20px*var(--u,1)) 0 calc(24px*var(--u,1));color:#fff;z-index:3;pointer-events:none;font-weight:600;font-size:calc(10px*var(--u,1));letter-spacing:.01em}
.sb svg{display:block;height:calc(9px*var(--u,1));width:auto;fill:#fff}
.sb .ic{display:flex;align-items:center;gap:calc(4px*var(--u,1))}
.homebar{position:absolute;bottom:calc(5px*var(--u,1));left:50%;width:calc(84px*var(--u,1));height:calc(3px*var(--u,1));margin-left:calc(-42px*var(--u,1));border-radius:3px;background:#fff;opacity:.85;z-index:3;pointer-events:none}
.ctl{position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.ctl button{width:38px;height:38px;color:#111;background:#fff;border:1px solid #d9d9de;border-radius:50%;cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.ctl button:focus-visible{outline:2px solid var(--red);outline-offset:2px}.ctl button[disabled]{opacity:.45;cursor:default}
/* opened on a computer: show the same mobile screen inside a phone-shaped box (395 x 775 like a real phone) */
@media (min-width:700px){
 body{background:#e8eaef}
 .device{height:min(860px,calc(100vh - 56px));height:min(860px,calc(100svh - 56px));width:auto;aspect-ratio:395/775;border-radius:36px;box-shadow:0 0 0 10px #101012,0 0 0 12px #34343a,0 24px 60px rgba(0,0,0,.35)}
}
</style>
</head>
<body>
<div class="device"><div class="page">
 <header class="top">
  <a href="#" aria-label="VoiceToNotes"><img src="lp-logo.png" alt="VoiceToNotes"></a>
  <button class="menu" type="button" aria-label="Open menu"><i></i></button>
 </header>
 <main>
  <section class="hero">
   <h1>Voice to Notes with <em>AI</em><br>Turn Speech into Smart Notes.</h1>
   <p class="lead">Convert voice into accurate notes, transcripts, AI summaries, meeting notes, study notes, and action items in real time. VoiceToNotes helps you stay focused while AI captures every word.</p>
   <a class="cta" href="#">Download App</a>
  </section>
  <section class="phonewrap" aria-label="Voice To Note app, live animation">
   <div class="pstage"><div class="phone" id="phone">
    <div class="screen" id="screen"><i class="island"></i><div class="sb" aria-hidden="true"><span>9:41</span><span class="ic"><svg viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="6" rx="1"/><rect x="10" y="2.5" width="3" height="8.5" rx="1"/><rect x="15" y="0" width="3" height="11" rx="1"/></svg><svg viewBox="0 0 16 11"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.2A10.4 10.4 0 0 0 8 .5 10.4 10.4 0 0 0 .9 3.4L2 4.6a8.6 8.6 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.1-1.2A7 7 0 0 0 8 4.1a7 7 0 0 0-4.5 1.8l1.1 1.2c.9-.8 2.1-1.3 3.4-1.3zM8 9.4l1.9-2a2.8 2.8 0 0 0-3.8 0z"/></svg><svg viewBox="0 0 27 12"><rect x=".5" y=".5" width="22" height="11" rx="3.2" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="19" height="8" rx="2"/><rect x="24" y="4" width="2" height="4" rx="1" opacity=".5"/></svg></span></div><iframe id="anim" title="Voice To Note live workflow animation" tabindex="-1"></iframe><i class="homebar"></i></div>
    <div class="ctl"><button id="pauseBtn" type="button" aria-label="Pause the animation" title="Pause"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><rect x="6" y="4.5" width="4.2" height="15" rx="1.2"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.2"/></svg></button><button id="replayBtn" type="button" aria-label="Replay the animation from the start" title="Replay"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button></div>
   </div></div>
  </section>
 </main>
</div></div>
<script>
(()=>{ // The phone plays index.html (the animation). It starts from step 1 when the phone scrolls into view.
// Touch the phone and it becomes the real app. Tap outside the phone, or press Replay, to start again.
const fr=document.getElementById('anim'),ph=document.getElementById('phone'),sc=document.getElementById('screen'),pb=document.getElementById('pauseBtn');
let touched=false,started=false;
const setPause=v=>{pb.disabled=v};
const load=()=>{touched=false;started=true;fr.src='index.html?embed&t='+Date.now()};
// the animation (360x800) sits inside the screen's safe area: below the notch, above the rounded bottom corners
const fit=()=>{const W=sc.clientWidth,H=sc.clientHeight,top=H*.06,bot=H*.032,k=Math.min(W/360,(H-top-bot)/800);
 sc.style.setProperty('--u',H/522);fr.style.transform='scale('+k+')';fr.style.left=(W-360*k)/2+'px';fr.style.top=top+'px'};
addEventListener('resize',fit);fit();if('ResizeObserver' in window)new ResizeObserver(fit).observe(sc);
fr.addEventListener('load',()=>setPause(false));
if('IntersectionObserver' in window){new IntersectionObserver((es,o)=>{if(!started&&es.some(e=>e.isIntersecting)){load();o.disconnect()}},{threshold:.5}).observe(ph)}else load();
addEventListener('blur',()=>{if(document.activeElement===fr){touched=true;setPause(true)}}); // a tap inside the phone moves focus into the iframe
document.addEventListener('pointerdown',e=>{if(touched&&!ph.contains(e.target)&&!e.target.closest('.ctl')){load()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&started)load()});
// Pause freezes the demo where it is (then try the app by hand). Replay starts again from step 1.
pb.onclick=()=>{try{const d=fr.contentDocument;Object.defineProperty(d,'hidden',{get:()=>true,configurable:true});d.dispatchEvent(new Event('visibilitychange'))}catch(e){}setPause(true)};
document.getElementById('replayBtn').onclick=load;
})();
</script>
</body>
</html>
